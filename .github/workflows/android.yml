name: Build Android (Play bundle + test APK)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: npm install

      - name: Setup Python (for the Arabic commentary voice)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg (broadcast-style processing of the commentary voice)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache the generated commentary voice
        id: voicecache
        uses: actions/cache@v4
        with:
          path: www/audio/voice
          key: voice-v2-${{ hashFiles('voice/lines_*.json', 'scripts/gen_voice.py') }}-${{ secrets.ELEVENLABS_API_KEY != '' && 'el' || 'ms' }}

      - name: Generate the Arabic commentary voice (ElevenLabs / Azure if keys exist, otherwise Microsoft neural)
        if: steps.voicecache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python scripts/gen_voice.py

      - name: Bundle the font and copy the game into the Android project
        run: |
          npm run fonts
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # مفتاح الرفع من GitHub Secrets: KEYSTORE_BASE64 + KEYSTORE_PASSWORD (و KEY_ALIAS / KEY_PASSWORD اختياري)
      - name: Prepare the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KS_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Upload key found: the bundle will be signed"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: the bundle will be unsigned"
          fi

      - name: Build release bundle (AAB) and a test APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          VC=$(( ${{ github.run_number }} + 100 ))
          echo "versionCode $VC"
          ./gradlew bundleRelease assembleDebug -PautoVersionCode=$VC
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Collect the files
        run: |
          mkdir -p out
          VC=$(( ${{ github.run_number }} + 100 ))
          if [ -n "$KS_FILE" ]; then AAB=masiret-v$VC-play.aab; else AAB=masiret-v$VC-unsigned.aab; fi
          cp android/app/build/outputs/bundle/release/app-release.aab out/$AAB
          cp android/app/build/outputs/apk/debug/app-debug.apk out/masiret-v$VC-test.apk
          ls -la out

      # Only builds of main replace the "builds" branch; test builds of other branches are kept as workflow artifacts only
      - name: Keep them on the "builds" branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd out
          git init -q -b builds
          git add .
          git -c user.name="build bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Android build $(( ${{ github.run_number }} + 100 ))"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: masiret-android-${{ github.run_number }}
          path: out/*
