name: Build Android (Play bundle + test APK)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: npm install

      - name: Setup Python (for the Arabic commentary voice)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate the Arabic commentary voice (Azure if the key exists, otherwise Piper)
        continue-on-error: true
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python scripts/gen_voice.py

      - name: Bundle the font and copy the game into the Android project
        run: |
          npm run fonts
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build release bundle (AAB) and a test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug -PautoVersionCode=${{ github.run_number }}

      # If the upload key is stored as repository secrets, sign here; otherwise the unsigned bundle is signed later.
      - name: Sign the bundle (only when the key secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab android/app/build/outputs/bundle/release/app-release.aab "$ALIAS"
          rm upload.jks

      - name: Collect the files
        run: |
          mkdir -p out
          N=${{ github.run_number }}
          cp android/app/build/outputs/bundle/release/app-release.aab out/masiret-$N-unsigned.aab
          [ -f android/app/build/outputs/bundle/release/app-release-signed.aab ] && cp android/app/build/outputs/bundle/release/app-release-signed.aab out/masiret-$N-signed.aab || true
          cp android/app/build/outputs/apk/debug/app-debug.apk out/masiret-$N-test.apk
          ls -la out

      - name: Keep them on the "builds" branch
        run: |
          cd out
          git init -q -b builds
          git add .
          git -c user.name="build bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Android build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: masiret-android-${{ github.run_number }}
          path: out/*
