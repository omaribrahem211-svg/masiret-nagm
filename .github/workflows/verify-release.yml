name: Verify an existing APK build and publish it as a prerelease

# Does NOT build anything. Downloads the artifact of an earlier "Build Android" run, verifies the exact APK file from that
# run (package id, version, signature, update compatibility with the previous test APK on the "builds" branch, zip
# alignment, every web file present and identical to the build commit, JavaScript syntax), and only if every check
# passes creates a GitHub prerelease with that APK attached.
# Runs on a push of THIS file to final-gameplay (workflow_dispatch needs the file on the default branch, and main must not be
# touched). The run to verify is set in env below.
on:
  push:
    branches: [final-gameplay]
    paths: ['.github/workflows/verify-release.yml']

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: '43581916610'
      ARTIFACT: masiret-android-30
      TAG: v130-rc1
      PUBLISH: 'true'
    steps:
      - name: Checkout (full history, to compare with the build commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the artifact of the build run
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: art

      - name: Verify
        id: v
        run: |
          set -euo pipefail
          R=report.txt; : > $R
          say(){ echo "$*" | tee -a $R; }
          fail(){ say "FAIL: $*"; echo FAILED > failed.flag; }
          APK=$(ls art/*-test.apk); say "APK: $(basename $APK)"
          RUN=$(gh api repos/${{ github.repository }}/actions/runs/${{ env.RUN_ID }})
          SHA=$(echo "$RUN" | jq -r .head_sha); BR=$(echo "$RUN" | jq -r .head_branch); CON=$(echo "$RUN" | jq -r .conclusion); T=$(echo "$RUN" | jq -r .updated_at)
          say "Build run: ${{ env.RUN_ID }}  branch=$BR  commit=$SHA  conclusion=$CON  finished=$T"
          [ "$CON" = success ] || fail "build run did not succeed"
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          say "Size: $(stat -c %s $APK) bytes"
          say "SHA-256: $(sha256sum $APK | cut -d' ' -f1)"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1); say "build-tools: $(basename $BT)"
          say "--- aapt2 dump badging"
          $BT/aapt2 dump badging $APK > badging.txt || fail "aapt2 could not read the APK"
          grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:|^launchable-activity|^native-code" badging.txt | tee -a $R || true
          grep -q "package: name='com.asomygames.masiretnagm'" badging.txt || fail "package id"
          VC=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" badging.txt); VN=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" badging.txt)
          EXP=$(( $(echo "$RUN" | jq -r .run_number) + 100 )); [ "$VC" = "$EXP" ] || fail "versionCode $VC != expected $EXP"
          say "versionCode=$VC versionName=$VN (expected code $EXP)"
          grep -q "^sdkVersion:'24'" badging.txt || fail "minSdk is not 24 (android/variables.gradle)"
          say "--- zipalign"
          $BT/zipalign -c -P 16 -v 4 $APK > zipalign.txt 2>&1 && say "zipalign: OK (4-byte, 16 KB page alignment for .so)" || { tail -5 zipalign.txt | tee -a $R; $BT/zipalign -c 4 $APK && say "zipalign: OK (4-byte)" || fail "zipalign"; }
          say "--- apksigner"
          $BT/apksigner verify --verbose --print-certs $APK > signer.txt 2>&1 || fail "apksigner verify"
          grep -E "^Verifies|Verified using|Number of signers|Signer #1 certificate (DN|SHA-256)" signer.txt | tee -a $R || true
          grep -q "Signer #1 certificate DN: C=US, O=Android, CN=Android Debug" signer.txt && say "WARNING: signed with the Android debug key (KEYSTORE secret missing)" || say "Signed with the project upload key (not the Android debug key)"
          NEW=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signer.txt)
          say "--- update compatibility with the previous test APK on the 'builds' branch"
          git fetch -q origin builds && OLDN=$(git ls-tree --name-only origin/builds | grep -- '-test.apk' | head -1) && git show origin/builds:$OLDN > old.apk && say "previous: $OLDN"
          $BT/aapt2 dump badging old.apk | grep "^package:" | tee -a $R
          $BT/apksigner verify --print-certs old.apk > oldsig.txt 2>&1 || true
          OLD=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' oldsig.txt)
          OVC=$($BT/aapt2 dump badging old.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          [ -n "$NEW" ] && [ "$NEW" = "$OLD" ] && say "same signing certificate as $OLDN: YES ($NEW)" || fail "signing certificate differs from $OLDN"
          [ "$VC" -gt "$OVC" ] && say "versionCode $VC > $OVC: update allowed" || fail "versionCode not higher than previous"
          say "--- web assets: every file of www/ at the build commit is in the APK and byte-identical"
          rm -rf x && mkdir x && unzip -q $APK -d x
          MISS=0; DIFF=0; N=0
          for f in $(git ls-tree -r --name-only $SHA www); do N=$((N+1)); p="x/assets/public/${f#www/}"; if [ ! -f "$p" ]; then MISS=$((MISS+1)); say "missing: $f"; elif ! cmp -s "$p" <(git show $SHA:$f); then DIFF=$((DIFF+1)); say "differs: $f"; fi; done
          say "www files at build commit: $N   missing: $MISS   different: $DIFF"
          [ $MISS = 0 ] || fail "missing web files"
          [ $DIFF = 0 ] || fail "web files differ from the build commit"
          say "files only in the APK web folder (generated at build time): $(cd x/assets/public && find . -type f | sed 's#^\./#www/#' | sort > /tmp/a.txt; git ls-tree -r --name-only $SHA www | sort > /tmp/b.txt; comm -23 /tmp/a.txt /tmp/b.txt | sed 's#^www/##' | awk -F/ '{print $1"/"$2}' | sort | uniq -c | tr '\n' ';')"
          say "--- JavaScript syntax (node --check) of every .js in the APK web folder"
          BAD=0; for j in $(find x/assets/public -name '*.js'); do node --check "$j" 2>/dev/null || { BAD=$((BAD+1)); say "syntax error: $j"; }; done
          say "js files checked: $(find x/assets/public -name '*.js' | wc -l)   syntax errors: $BAD"; [ $BAD = 0 ] || fail "javascript syntax"
          say "index.html scripts present: $(grep -o 'src=\"[^\"]*\.js\"' x/assets/public/index.html | sed 's/src=\"//;s/\"//' | while read s; do [ -f "x/assets/public/$s" ] && echo ok || echo "MISSING:$s"; done | sort | uniq -c | tr '\n' ' ')"
          grep -o 'src="[^"]*\.js"' x/assets/public/index.html | sed 's/src="//;s/"//' | while read s; do [ -f "x/assets/public/$s" ] || echo FAILED > failed.flag; done
          say "capacitor.config.json in APK: $(cat x/assets/capacitor.config.json | tr -d '\n' | head -c 200)"
          say "--- result"; if [ -f failed.flag ]; then say "RESULT: FAILED"; exit 1; else say "RESULT: ALL CHECKS PASSED"; fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-${{ env.TAG }}
          path: |
            report.txt
            badging.txt
            signer.txt

      - name: Publish the prerelease (only reached when every check passed)
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          APK=$(ls art/*-test.apk); SUM=$(sha256sum $APK | cut -d' ' -f1)
          { echo "Release candidate for real-device testing. Built by run ${{ env.RUN_ID }} from commit ${{ steps.v.outputs.sha }} (branch final-gameplay). Not merged into main."; echo; echo "SHA-256 of the APK: \`$SUM\`"; echo; echo '```'; cat report.txt; echo '```'; } > notes.md
          gh release create "${{ env.TAG }}" "$APK" report.txt --prerelease --target "${{ steps.v.outputs.sha }}" --title "${{ env.TAG }}" --notes-file notes.md
