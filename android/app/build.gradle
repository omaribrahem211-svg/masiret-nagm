apply plugin: 'com.android.application'

android {
    namespace = "com.asomygames.masiretnagm"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.asomygames.masiretnagm"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // رقم النسخة بيزيد لوحده مع كل بناء على GitHub (رقم البناء + 100)، فكل AAB ينفع يترفع على جوجل بلاي
        def autoCode = project.hasProperty('autoVersionCode') ? project.property('autoVersionCode').toInteger() : 1
        versionCode autoCode
        versionName "1." + (int)(autoCode / 100) + "." + (autoCode % 100)
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // التوقيع: مفتاح الرفع (upload key) بييجي من GitHub Secrets وقت البناء، وعمره ما بيتحط في الريبو
    def ksFile = System.getenv("KS_FILE")
    def hasKey = ksFile != null && ksFile != "" && file(ksFile).exists()
    signingConfigs {
        upload {
            if (hasKey) {
                storeFile file(ksFile)
                storePassword System.getenv("KS_PASS")
                keyAlias(System.getenv("KS_ALIAS") ?: "upload")
                keyPassword(System.getenv("KEY_PASS") ?: System.getenv("KS_PASS"))
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasKey) signingConfig signingConfigs.upload
        }
        // نسخة التجربة بتتوقع بنفس المفتاح، فكل نسخة جديدة بتتسطب فوق القديمة والمسيرة ما تضيعش
        debug {
            if (hasKey) signingConfig signingConfigs.upload
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    // تحديثات Google Play من جوه اللعبة
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.android.gms:play-services-tasks:18.1.0"
}

apply from: 'capacitor.build.gradle'
