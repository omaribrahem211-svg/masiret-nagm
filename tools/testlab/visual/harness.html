<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>defence visual harness</title>
<style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="game" width="1920" height="1080"></canvas><pre id="out"></pre>
<script src="../../../www/js/data.js"></script>
<script src="../../../www/js/core.js"></script>
<script src="../../../www/js/rig.js"></script>
<script src="../../../www/js/kittex.js"></script>
<script src="../../../www/js/stad3d.js"></script>
<script src="../../../www/js/skel.js"></script>
<script src="../../../www/js/render3d.js"></script>
<script>
// Phase 2.3 visual check (tools only, never shipped): plays a seeded AI-vs-AI defensive scenario with the real engine and the real
// WebGL2 renderer, and grabs frames. Scenario chosen by ?s=… ; frames are written as data URLs into <pre id=out> (read via --dump-dom).
var App={match:null,settings:{halfLen:120,diff:0,gfx:2,cam:0},demo:null};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R0=Math.random;let RF=mulberry32(1);Math.random=()=>RF();
const Q=new URLSearchParams(location.search),S=Q.get('s')||'A1',SEED=+(Q.get('seed')||7001),EVERY=+(Q.get('every')||4),N=+(Q.get('n')||150),CAMD=+(Q.get('camd')||9);
const out=[];
try{
 RF=mulberry32(42);
 const m=new Match({home:{name:'H',kit:3,R:75,nm:'ar'},away:{name:'A',kit:0,R:75,nm:'en'},human:null,halfLen:120,intro:false,onEvent:()=>{},onEnd:()=>{}});
 App.match=m;RF=mulberry32(SEED);
 for(let i=0;i<200;i++)m.update(1/60);if(m.walk)m.endWalk();m.phase='play';m.restartKind=null;m.pen=null;
 const def=m.t[0],att=m.t[1],og=m.ownG(def),sx=og[0]<L/2?-1:1;
 m.all.forEach((p,i)=>{if(p.role==='GK'){const g=m.ownG(p.team);p.x=g[0]+(g[0]<1?1:-1);p.y=CY;}else{p.x=20+(i%8)*9;p.y=W-1.5-(i%3)*.8;}p.vx=p.vy=0;p.stun=p.slide=p.cool=p.tcool=0;p.spT=null;p.pend=null;p.hold=0;p.chalOn=null;});
 const a=att.pl.find(p=>p.role==='FW'),d=def.pl.find(p=>p.role==='DF');
 const sp=S==='SLOW'?3:7.5;if(sp>a.ms)a.ms=a.mse=sp+.3;
 const dist=S==='A3'?3:S==='B2'?10:12,lat=S==='B2'?3:0;
 a.x=L/2-sx*8;a.y=CY;a.fx=sx;a.fy=0;a.vx=sx*sp;a.vy=0;d.x=a.x+sx*dist;d.y=CY+lat;d.fx=-sx;d.fy=0;
 Object.assign(m.ball,{x:a.x+a.fx*.45,y:a.y,z:0,vx:a.vx,vy:0,vz:0,owner:a,last:a,target:null,shot:null,inHands:false,offside:null});
 // attacker never passes (1-v-1), like the 'np' lab scenarios
 const BP=m.bestPass.bind(m),PS=m.pass.bind(m);m.bestPass=(p,...r)=>p===a?null:BP(p,...r);m.pass=(p,...r)=>{if(p===a)return;return PS(p,...r);};
 const cv=document.getElementById('game'),R3=new R3D(cv);R3.quality=2;
 const log=[];let t=1000;
 for(let i=0;i<N;i++){m.update(1/60);t+=1000/60;
  // simple side camera close to the defender (the renderer's own broadcast camera is used; we steer its target via the ball)
  R3.render(m,1920,1080,1,t);const pd=R3.project(d.x,d.y,1,1920,1080),pa=R3.project(a.x,a.y,1,1920,1080);
  log.push({i,dx:+(d.x-a.x).toFixed(2),dv:[+d.vx.toFixed(1),+d.vy.toFixed(1)],f:[+d.fx.toFixed(2),+d.fy.toFixed(2)],tk:!!d.tkL,stun:+d.stun.toFixed(2),rec:+(d.recT||0).toFixed(2),act:d._act||'',own:m.ball.owner?m.ball.owner.role+m.ball.owner.team.idx:'-',pd,pa,ch:def.chaser===d,tt:m.ball.owner===a?m.tkTime(d):null,bl:m.ball.owner===a?m.tkBlocked(d,a):null,dB:+Math.hypot(m.ball.x-d.x,m.ball.y-d.y).toFixed(2),tcool:+d.tcool.toFixed(2),chal:d.chalOn===a});
  if(i%EVERY===0)out.push(cv.toDataURL('image/jpeg',.82));
 }
 document.getElementById('out').textContent=JSON.stringify({ok:true,log,frames:out});
}catch(e){document.getElementById('out').textContent=JSON.stringify({ok:false,err:String(e&&e.stack||e)});}
</script></body></html>
